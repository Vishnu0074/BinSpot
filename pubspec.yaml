name: binspot_app
description: BinSpot community bin mapping app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_map: ^8.1.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/binspot.png
